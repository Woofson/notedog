[package]
name = "notedog"
version = "0.5.9"
edition = "2021"
authors = ["Bolt J Woofson <bolt@boop.no>"]
description = "A vibrant, cross-platform TUI Notes application in Rust inspired by OneNote and Obsidian"
license = "MIT"
repository = "https://github.com/Woofson/notedog"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
pulldown-cmark = "0.12"
regex = "1.11"
unicode-width = "0.1"
zeroize = "1.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
